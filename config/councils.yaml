# Perth metropolitan and Peel local governments.
#
# The monthly discovery job starts from each homepage, follows redirects, and
# finds the events / what's on / library events pages by itself. Its results go
# to config/sources.json (machine-written; don't edit by hand).
#
# Use the optional keys below to correct discovery for a council:
#   pin:     [urls]   always use these pages as event sources
#   exclude: [urls]   never use these pages (prefix match)
#   skip:    true     leave this council out entirely
#
# Example:
#   - name: City of Melville
#     region: metro
#     homepage: https://www.melvillecity.com.au
#     pin:
#       - https://www.melvillecity.com.au/things-to-do/whats-on

