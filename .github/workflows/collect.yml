name: Collect events

on:
  schedule:
    - cron: "43 21 * * *"   # 5:43am Perth time, every day
  push:                     # re-collect after editing config or code
    branches: [main]
    paths: ["config/*.yaml", "monitor/**", "requirements.txt", ".github/workflows/collect.yml"]
  workflow_dispatch:
    inputs:
      council:
        description: "Only this council (blank = all). For testing; partial runs replace the event list."
        required: false

permissions:
  contents: write   # commit the refreshed data

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Find event pages (first run only)
        if: hashFiles('config/sources.json') == ''
        run: python -m monitor.discover

      - name: Collect events
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: |
          if [ -n "${{ inputs.council }}" ]; then
            python -m monitor.collect --council "${{ inputs.council }}"
          else
            python -m monitor.collect
          fi

      - name: Commit data
        run: |
          git config user.name "events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.json reports data docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update events $(TZ=Australia/Perth date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
