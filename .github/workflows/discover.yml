name: Find event pages

on:
  schedule:
    - cron: "17 20 1 * *"   # 4:17am Perth time on the 1st of each month
  workflow_dispatch:
    inputs:
      council:
        description: "Only councils whose name contains this (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover
        run: |
          if [ -n "${{ inputs.council }}" ]; then
            python -m monitor.discover --council "${{ inputs.council }}"
          else
            python -m monitor.discover
          fi
      - name: Show report
        run: cat reports/discovery.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.json reports
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh event sources $(TZ=Australia/Perth date +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
